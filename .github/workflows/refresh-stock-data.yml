name: Refresh stock watch data

on:
  schedule:
    # One table refreshed per run, staggered across the top of each hour —
    # see REFRESH_SCHEDULE in fetch-stock-data.mjs for which table maps to
    # which minute. Kept as separate entries (rather than one combined
    # '0-3,5 * * * *') so github.event.schedule tells the script exactly
    # which one fired — GitHub Actions schedule triggers can run a few
    # minutes late under load, so the script can't reliably infer which
    # table to refresh just by reading the wall clock at execution time.
    # Minute 4 is deliberately left free so a future table can slot in
    # there before the next used minute (currently 5).
    - cron: '0 * * * *'
    - cron: '1 * * * *'
    - cron: '2 * * * *'
    - cron: '3 * * * *'
    - cron: '5 * * * *'
  workflow_dispatch: {}

# Runs are only ~60 seconds apart, so without this a slow run could still be
# fetching (or mid git-push) when the next one starts, and both would race
# to push the same file — serialize instead of running concurrently.
concurrency:
  group: refresh-stock-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest stock data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: node .github/scripts/fetch-stock-data.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add the-lookout/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh stock watch data"
            git push
          fi
